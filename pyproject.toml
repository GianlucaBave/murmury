[project]
name = "murmury"
version = "0.1.5"
description = "Listens to an online call on this Mac and answers the other side's questions from chosen material (ADR-013)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "faster-whisper>=1.1; sys_platform != 'darwin'",
    "anthropic>=1",
    "pypdf>=5",
    "openpyxl>=3.1",
    "PySide6>=6.8",
    "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
    "keyring>=25.7.0",
    "openai>=3.26.1",
    "fastembed>=0.9.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2.2; sys_platform == 'darwin'",
]
